# This project's answers to the kit's questions. Read by kit/tools/project.py,
# and by nothing else.
#
# WHAT BELONGS HERE: what somebody READ. Where this repository keeps things, and
# the facts a person took out of the target once.
#
# WHAT DOES NOT: anything MEASURED, and anything machine-specific. A measured
# value goes stale quietly; a machine path may never be committed. The latter
# goes in kit.local.toml, which git ignores and which overrides this file key by
# key.
#
# The target is DemoVT v1.31b -- the music player that shipped inside Psycho
# Neurosis as NEUROSIS.008, LZEXE-packed, unpacked back to a load image.

[layout]
src   = "v1.31b/src"                   # the Pascal sources under reconstruction
build = "build"                        # where the DOSBox build stages and leaves its output
wiki  = "kit/wiki"                     # the field manual, inside the kit

[target]
# The paragraph the disassembly calls the start of the load image. Every address
# in this project's notes and configs is relative to it.
first_para = 0x1000

# The measurement target: the v1.31b build recovered from NEUROSIS.008 by
# tools/unlzexe.py. 58,176 bytes. It is TRACKED deliberately -- a checkout that
# cannot measure itself is not much use -- and v1.31b/refpath.py says what the
# unpacking cannot tell you about it.
image = "v1.31b/ref/vt1.31b.bin"

[census]
# Directories holding scripts, for the retirement census. The psycho checkout's
# path is machine-specific and belongs in kit.local.toml, not here.
roots = ["tools", "v1.31b", "kit/tools"]
