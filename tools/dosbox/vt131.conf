# DOSBox-X configuration for building VangeliSTracker 1.31b with Turbo Pascal 6.0.
#
# Deliberately SEPARATE from D:\DOSBox-X\dosbox-x.conf so the user's own setup
# is left alone. Invoke it with:
#
#     dosbox-x.exe -conf tools\dosbox\vt131.conf -silent -exit
#
# Drives:
#     C:  D:\DOSBox-X\Machine\HDD    the TP 7.01 install (C:\TP\BIN, C:\TP\UNITS)
#     D:  D:\source\VangeliSTracker\build     staging area -- 8.3 sources, output, logs
#
# C: has to be the HDD folder rather than HDD\TP, because the install's own
# BIN\TPC.CFG says "/UC:\TP\UNITS" and we do not want to modify it.

[sdl]
autolock    = false
waitonerror = false

[dosbox]
machine  = svga_s3
memsize  = 16
captures = capture
title    = vt131 build

[cpu]
core    = auto
cputype = pentium_ii
cycles  = max

[render]
frameskip = 0
aspect    = false

[mixer]
nosound = true

[dos]
xms = true
ems = true
umb = true
# Keep long filenames OFF -- TP7 is a 1993 real-mode tool and everything we
# stage is 8.3 anyway. Turning LFN on only invites surprises.
lfn = false

[autoexec]
mount C D:\DOSBox-X\Machine\HDD
mount D D:\source\VangeliSTracker\build
set PATH=%PATH%;C:\TP\BIN
D:
call D:\BUILD.BAT
exit
