# This directory is its own HOST ROOT for the kit, and that is deliberate.
#
# `kit/tools/project.py` walks UP from the working directory looking for
# kit.toml, and the kit's model is one target per host root -- `target.image`
# is a single path, not a table. This repository now reconstructs two builds of
# one program, so the second one gets its own root rather than overwriting the
# first one's answers. Run every v1.51 command with this directory as the
# working directory:
#
#     cd v1.51 && ..\.venv\Scripts\python.exe ..\kit\tools\pascal\build.py build.toml
#
# v1.31b/ is the same shape -- its own kit.toml, build.toml and build/ beside
# its sources. The repository root holds no kit.toml at all: it is a container
# for the two reconstructions and the kit, and answers for neither on its own.
#
# The target is DemoVT v1.51 -- April 1994, the released version, shipped in
# demovt15.zip as DEMOVT.EXE, LZEXE 0.91-packed, unpacked back to a load image.

[layout]
src   = "src"                          # the Pascal sources under reconstruction
build = "build"                        # where the DOSBox build stages and leaves its output
# The same directory, under the name `dgimage.py` asks for. It wants the LINKED
# output rather than the staged sources; here they share a directory.
built = "build"
wiki  = "../kit/wiki"                  # the field manual, inside the kit
# The status register: the ratchet, the observations and the plan. FIVE
# instruments want it -- artefact.py, observe.py, plan.py, ratchet.py and
# routines.py -- and every one of them exited 2 here until this line existed.
# This reconstruction had the instruments and not the ratchet: nothing in it
# could notice a match getting shorter. re-kit issue #1.
register = "status.toml"
# Which files in `built` are OURS. EXPLICIT, not a glob, and deliberately so:
# a glob can include but not exclude, and a compare tool aimed at an original
# measures it against itself and PASSES, which is the worst kind of wrong. Our
# build leaves exactly one executable. The originals are ref/*.bin and
# ../DEMOVT15/DEMOVT.EXE, and neither is in `built`.
built_pattern = ["VTMAIN.EXE"]
# The shared assembler includes, compared against the units. WITHOUT THIS the
# duplicate check has a hole exactly where its own fix lives: a marker followed
# by {$I} is skipped as shared, so an include body is compared against nothing
# and a unit holding its own copy pairs with nobody. This tree has VTGAIN.INC,
# so the hole was real here and the instrument said so on every run.
includes = "src"
# Assembler duplicated between units that cannot become one text. Measured
# empty -- see the file's own header. shared_asm.py refuses to report without
# it, so this answer is what lets the check run at all rather than what
# excuses anything.
exempt = "src/shared-exempt.txt"

[target]
# The paragraph the disassembly calls the start of the load image. The same
# 0x1000 the v1.31b notes use, so an address is comparable between the two
# versions without arithmetic.
first_para = 0x1000

# The measurement target: DEMOVT.EXE from demovt15.zip, unpacked by
# kit/tools/substrate/unlzexe.py. 66,448 bytes -- 3,408 of header and a
# 63,040-byte load image. See ref/README.md.

# The PACKED original, which is what actually shipped. lzpack.py needs it both
# as the comparison target and as the source of LZEXE's decompressor stub.
packed = "../DEMOVT15/DEMOVT.EXE"

[target.original]
# WHICH file each part's routines were read out of, keyed by the three-digit
# part an @asm marker carries. This reconstruction has ONE original, so the
# table holds one row -- and the TABLE is the general form, not `image`. A
# marker carries a part whether or not a project has one original, so the map
# covers both shapes; an image cannot be turned into a map, because the part is
# exactly what an image does not carry. The one multi-part consumer answers
# this and cannot answer `image` at all.
#
# `target.image` is DERIVED from this row by project.py, announced like any
# other answer, so the eight instruments that ask for an image still get one
# and the path is stated ONCE. See re-kit: retiring `target.image` outright is
# a separate change to those eight.
"000" = "ref/vt1.51.bin"

[encaudit]
dirs = ["src"]
