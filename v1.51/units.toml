# Every compiled unit, and the v1.51 segment it must rebuild.
#
# GENERATED on 28 Aug 2026 from the measured segment map in link.toml. `length`
# is the ORIGINAL's code length -- the segment's extent less the linker's zero
# padding -- so a unit may legitimately compile SHORTER and only the overlap is
# compared.
#
# THE RTL UNITS ARE ABSENT because DOS, OBJECTS and SYSTEM are not ours to
# rebuild. Nothing else is: the two new segments this file once listed as
# having no source are STMLOADE and S3MLOADE below, transcribed and byte-exact
# since 28 Aug 2026. An absent row is still not a pass -- see
# docs/CONTINUATION.md.
#
# The PROGRAM segment has no row either, and that is the file's shape rather
# than a gap: units.py measures units. VTMAIN is measured by linkbytes.py and
# blocks/1000.toml.

sources  = "src"
rewrites = ["tp6_far"]

