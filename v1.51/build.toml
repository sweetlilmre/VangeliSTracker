# How DemoVT v1.51 is built. Read by kit/tools/pascal/build.py, which holds the
# method; everything here is this target's own data.
#
# STARTED as a copy of the repository root's build.toml -- the v1.31b build --
# on 28 Aug 2026, with the paths made relative to THIS directory, which is its
# own host root (see kit.toml beside it). Every fact below was measured on
# v1.31b and is CARRIED rather than confirmed; each one has to be re-measured
# against v1.51 before it counts. The compiler is the one exception -- see the
# [compiler] note.
#
# NO MACHINE PATHS. DOSBox-X, the drive C: image and each compiler's location
# live in kit.local.toml, which git ignores.

src     = "src"
build   = "build"
title   = "DemoVT 1.51 build"
drive   = "D"
log     = "BUILD.LOG"
timeout = 180
lint    = "../kit/tools/pascal/paslint.py"

[compiler]
# TURBO PASCAL 6, and for v1.51 that is MEASURED rather than carried.
# A minimal linked program built with each install gives an RTL fingerprint:
# TP6's SYSTEM prologue is found in BOTH vt1.31b.bin (seg 1ba1) and
# vt1.51.bin (seg 1d89); TP7's is found in neither. TP6.0 and TP6.01 are
# indistinguishable on that test -- 33.1% against 33.0% -- exactly as they
# are on v1.31b, so the patch level is open here too.
default = "tp6"

[compiler.tp6]
# TP6's install is flat -- TPC.EXE sits in C:\\TP6 rather than a BIN
# subdirectory -- and its own TPC.CFG beside it carries the unit path.
binpath = "C:\\TP6"
dialect = "tp6"
switches = "/$A+ /$B- /$D+ /$E+ /$F- /$G+ /$I- /$L+ /$N+ /$O- /$R- /$S- /$V- /$X+ /Q"

[compiler.tp61]
# Turbo Pascal 6.01: TPC.EXE dated 11-Jun-1991 at 69,278 bytes, beside 6.0's
# 69,214 of 23-Oct-1990. A different TP6 patch level is one of the three
# candidate explanations for the divergences that survive both compilers, so
# it is worth being able to build with.
binpath = "C:\\TP61"
dialect = "tp6"
switches = "/$A+ /$B- /$D+ /$E+ /$F- /$G+ /$I- /$L+ /$N+ /$O- /$R- /$S- /$V- /$X+ /Q"

[compiler.tp7]
binpath = "C:\\TP\\BIN"
switches = "/$A+ /$B- /$D+ /$E+ /$F- /$G+ /$I- /$L+ /$N+ /$O- /$R- /$S- /$V- /$X+ /Q"

# The switches the original was actually built with, taken verbatim from
# TPC.CFG in the VangeliSTracker 1.39b source release. They had been guessed at
# before that (only /$S-), which is a poor foundation for a byte-exact target:
# $G+ alone decides whether 286 instructions are emitted at all, and every unit
# except VTPLAYER was being compiled as plain 8086.
#
# Omitted deliberately: /U and /O (the build directory is flat here); /M (this
# drives the order itself -- TRIED AND REVERTED, because TP6 answers Error 68
# on SongUnit's circular reference rather than resolving it on demand); /GD
# (a detailed .MAP, until the map is useful); /V (debug info in the .TPU, and
# the shipped binary was run through tdstrip so it carries none).
#
# $D+ and $L+ are kept because the original's configuration has them; they add
# debug information rather than code, and tdstrip removes it afterwards.

[assembler]
# 1a17's 0746..10c3 was built with an object module in the original, and the
# 1.39b release builds the same unit that way. /la leaves a listing, which is
# the quickest way to see what byte an instruction assembled to.
flags = "/la /m2"

[order]
# DECLARED, not derived. A person worked this order out against something the
# `uses` graph does not say: SongUnit's implementation names UnkLoader's and
# ModLoader's entry points while both of those units `uses SongUnit` in their
# INTERFACE, and no ordering of that cycle satisfies TP6 from scratch. The
# prepass below is what breaks it.
mode = "declared"
list = [
  "ASCIIZ.PAS",  # 1642  leaf
  "VTNOTES.PAS",  # 1650  leaf
  "FILTERS.PAS",  # 1544  leaf
  "VTCTRL.PAS",  # 14b7  leaf -- owns the control block
  "VTDOSRSZ.PAS",  # 188f  leaf
  "VTDOSMEM.PAS",  # 1880  leaf
  "FILEUTIL.PAS",  # 116a  leaf
  "VTSHELL.PAS",  # 1931  needs Dos
  "HARDWARE.PAS",  # 1b24  needs Dos (GetIntVec/SetIntVec)
  "VTDRIVER.PAS",  # --    no segment: the shared driver record
  "SOUNDDEV.PAS",  # 1a17  the player core -- complete
  "SOUNDBLA.PAS",  # 19a0  A DECLARED STUB -- four variables, no code
  "VTGLOBAL.PAS",  # --    no segment: the shared settings
  "DEVSB.PAS",  # 193a  the Sound Blaster device unit
  "GUS.PAS",  # 1723  the GUS hardware layer
  "DEVGUS.PAS",  # 1084
  "VTSILENC.PAS",  # 1065  BLOCKED on 1a17
  "VTRESID.PAS",  # 1b54
  "HEAPS.PAS",  # 17cf  the memory pool
  "SONGELEM.PAS",  # 165a  instrument, track, pattern -- IN PROGRESS
  "UNKLOADE.PAS",  # 164b  compiled against the BOOTSTRAP SongUnit
  "MODLOADE.PAS",  # 154d  ditto -- see the bootstrap note below
  "SONGUNIT.PAS",  # 14b9  the module object -- complete; needs the loaders
  "MODCOMMA.PAS",  # 142f  A STUB, and the home of TCanal
  "PLAYMOD.PAS",  # 12ba  IN PROGRESS -- transcribed from the top down
  "CMDLINE.PAS",  # 116e  the command line
  "VTCFG.PAS",  # 11bb  the config file
  "VTCMD.PAS",  # 109c  the switch table -- IN PROGRESS (needs VTCfg)
  "VTMAIN.PAS",  # 1000  the program -- BLOCKED, see below
]

[stage]
# TP6 and TP7 are DOS tools and choke on anything above 7 bits in source, so
# everything round-trips through the DOS code page and a character that cannot
# survive becomes visible here rather than as an error forty lines away.
encoding = "cp437"
# Every DemoVT source is already an 8.3 name and every unit identifier already
# matches its filename, so nothing is renamed -- an empty [names] says so.
alongside = ["src/*.ASM", "src/*.INC"]

[[compiler.tp6.prepass]]
# THE BOOTSTRAP PASS. Compile SongUnit once with /DBOOTSTRAP, which takes the
# `uses` and the table's initialiser out and leaves the INTERFACE unchanged;
# the loaders compile against that .TPU, and the order then recompiles SongUnit
# for real. It sits immediately before the first loader rather than at the top
# of the batch, because SongUnit still needs Heaps, SongElements and the rest
# compiled first.
#
# TP7 needs none of this and the 1.39b release does not do it, which is itself
# a small piece of evidence for TP6.
target   = "SONGUNIT.PAS"
before   = "UNKLOADE.PAS"
switches = "/DBOOTSTRAP"
why      = "bootstrap"

[[compiler.tp61.prepass]]
target   = "SONGUNIT.PAS"
before   = "UNKLOADE.PAS"
switches = "/DBOOTSTRAP"
why      = "bootstrap"

[names]

[install]
