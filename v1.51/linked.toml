# The v1.51 linked image's segment layout, and what counts as a DGROUP address.
#
# GENERATED on 28 Aug 2026 from the measured segment map in link.toml.

image = "VTMAIN.EXE"      # our linked image, in the build directory
map   = "VTMAIN.MAP"      # and its map, which says where each unit landed

# The initialised/uninitialised DGROUP boundary: the initialised half is
# everything from the constants segment to the end of the load image.
# MEASURED: 0x0d20 = 3360 bytes, against v1.31b's 0x0C70.
varbase  = 0x0D20
# The original's DGROUP size. MEASURED from the header: SS is 0x2530 and DGROUP
# begins at 0x1E92, so DGROUP is 0x69E paragraphs. The same arithmetic gives
# v1.31b's 0x4690 exactly, which is what makes it trustworthy here.
datalen  = 0x69E0
# A plausible misplacement. Beyond this the two words are not the same
# variable in two places, they are unrelated numbers.
maxdelta = 8192

# Not ours to compare: the runtime library's own units.
skip = ['DOS', 'OBJECTS', 'SYSTEM']

# The ORIGINAL's segment layout. Ours is read from the .MAP; the original
# has no map, so it is declared. Each entry's extent is the NEXT entry's
# address minus its own, so the last entry is a bound and names no unit.

