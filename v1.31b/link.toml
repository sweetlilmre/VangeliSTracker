# The original's link, as measured. Read by the kit's linkorder, mapcmp, dgroup
# and coverage instruments; everything here is this target's own data.
#
# GENERATED from v1.31b/linkorder.py, mapcmp.py and coverage.py on 23 Aug 2026
# by parsing them (psycho #50).
#
# THE TWO COPIES OF THE SEGMENT LIST WERE CROSS-CHECKED AGAINST EACH OTHER
# BEFORE BEING WRITTEN ONCE, AND THEY HAD DRIFTED. mapcmp carried it as
# (segment, name) pairs and linkorder as names in order; mapcmp's was missing
# VTSHELL at 0x1931, so that unit's length was never compared and the tool's
# "28 unit(s) exact" was 28 of 29. Written once here, read by both.
#
# EVERY BARE KEY COMES BEFORE THE FIRST TABLE HEADER, because in TOML a key
# after [table] belongs to that table -- which put `segments` inside [lists] on
# the first attempt and the reader raised KeyError.

map_file = "build/VTMAIN.MAP"
layout   = "v1.31b/docs/00-map.md"
# The program segment is measured block by block -- it emits no unit, so the
# per-unit table has nothing to say about it.
program_blocks = "v1.31b/blocks/1000.toml"
# Where the last segment ends. A boundary, not a unit.
end_at   = 0x1caa

# Segments holding constants and no code.
data = [
  { segment = 0x1caa, why = "constants only, no code" },
]

# THE ORIGINAL'S ORDER AND ADDRESSES, read off the segment addresses in the
# layout document -- the one thing about the original link that is directly
# measurable. The order of this list IS the link order.
segments = [
  { segment = 0x1000, name = "DEMOVT" },
  { segment = 0x1065, name = "VTSILENC" },
  { segment = 0x1084, name = "DEVGUS" },
  { segment = 0x109c, name = "VTCMD" },
  { segment = 0x116a, name = "FILEUTIL" },
  { segment = 0x116e, name = "CMDLINE" },
  { segment = 0x11bb, name = "VTCFG" },
  { segment = 0x12ba, name = "PLAYMOD" },
  { segment = 0x142f, name = "MODCOMMANDS" },
  { segment = 0x14b7, name = "VTCTRL" },
  { segment = 0x14b9, name = "SONGUNIT" },
  { segment = 0x1544, name = "FILTERS" },
  { segment = 0x154d, name = "MODLOADER" },
  { segment = 0x1642, name = "ASCIIZ" },
  { segment = 0x164b, name = "UNKLOADER" },
  { segment = 0x1650, name = "VTNOTES" },
  { segment = 0x165a, name = "SONGELEMENTS" },
  { segment = 0x1723, name = "GUS" },
  { segment = 0x17cf, name = "HEAPS" },
  { segment = 0x1880, name = "VTDOSMEM" },
  { segment = 0x188f, name = "VTDOSRSZ" },
  { segment = 0x1891, name = "OBJECTS" },
  { segment = 0x1931, name = "VTSHELL" },
  { segment = 0x193a, name = "DEVSB" },
  { segment = 0x19a0, name = "SOUNDBLASTER" },
  { segment = 0x1a17, name = "SOUNDDEVICES" },
  { segment = 0x1b24, name = "HARDWARE" },
  { segment = 0x1b54, name = "VTRESID" },
  { segment = 0x1b6f, name = "DOS" },
  { segment = 0x1ba1, name = "SYSTEM" },
]

# Our filename stem -> the unit name Turbo Pascal writes into the map. Only the
# ones that differ, plus the program, which the original calls DEMOVT.
[unitname]
"MODCOMMA"     = "MODCOMMANDS"
"MODLOADE"     = "MODLOADER"
"SONGELEM"     = "SONGELEMENTS"
"SOUNDBLA"     = "SOUNDBLASTER"
"SOUNDDEV"     = "SOUNDDEVICES"
"UNKLOADE"     = "UNKLOADER"
"VTMAIN"       = "DEMOVT"

[lists]
# No segment of their own in EITHER image: declarations only. Their position in
# the link order is unobservable, so the order diff excludes them.
noseg = ["VTDRIVER", "VTGLOBAL"]
# Never in scope: the runtime's own units, which we do not rebuild.
rtl = ["DOS", "OBJECTS", "SYSTEM"]
