# The block list for segment 12ba, and the facts the comparison needs.
# GENERATED from v1.31b/blocks.py by parsing it, when the five per-segment
# scripts became one tool -- psycho issue #34. The five differed only in
# these values.
#
# The labels here have had a leading `hex..hex ` stripped: blocks.py baked
# each block's address into its NAME because its output had no address
# column, and this tool prints one. Cosmetic, and verified as such --
# the per-block numbers were compared before and after.
#
# Read by the kit's blockcmp: one block is one routine, first byte to the
# next routine's first byte, and `transcribed = false` marks a placeholder
# that is expected not to agree yet.

segment = 0x12BA
length  = 5968
unit    = 'PLAYMOD.TPU'
# blocks.py searched range(-64, 64), NOT the 2400 the half-written
# segments use, and the narrow window is correct here: 12ba is FINISHED,
# so no block is displaced by a placeholder above it. A wide window on a
# finished segment is actively wrong -- the search ranks fewest REAL
# differences first, so it prefers a distant position scoring zero real
# against a run of zeros over the true position scoring three. Measured
# while merging these five scripts: a 2400 window moved one block to
# shift +1373 with 171 pending instead of +0 with 3 real.
window  = 64

[[block]]
name        = 'NullProcedure'
from        = 0x0000
to          = 0x0007
transcribed = true

