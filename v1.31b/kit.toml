# This project's answers to the kit's questions. Read by kit/tools/project.py,
# and by nothing else.
#
# THIS DIRECTORY IS ITS OWN HOST ROOT, and that is deliberate. `project.py`
# walks UP from the working directory looking for kit.toml, and the kit's model
# is one target per host root -- `target.image` is a single path, not a table.
# This repository reconstructs two builds of one program, so each gets its own
# root. Run every v1.31b command with this directory as the working directory:
#
#     cd v1.31b && ..\.venv\Scripts\python.exe ..\kit\tools\pascal\build.py build.toml
#
# The repository root holds no kit.toml at all: it is a container for the two
# reconstructions and the kit, and answers for neither on its own.
#
# WHAT BELONGS HERE: what somebody READ. Where this repository keeps things, and
# the facts a person took out of the target once.
#
# WHAT DOES NOT: anything MEASURED, and anything machine-specific. A measured
# value goes stale quietly; a machine path may never be committed. The latter
# goes in kit.local.toml, which git ignores and which overrides this file key by
# key.
#
# The target is DemoVT v1.31b -- the music player that shipped inside Psycho
# Neurosis as NEUROSIS.008, LZEXE-packed, unpacked back to a load image.

[layout]
src   = "src"                          # the Pascal sources under reconstruction
build = "build"                        # where the DOSBox build stages and leaves its output
wiki  = "../kit/wiki"                  # the field manual, inside the kit
# The same directory, under the name routines.py and the span instruments ask
# for. They want the LINKED output rather than the staged sources; here the two
# share a directory. Absent until now, so routines.py could not run at all.
built = "build"
# The status register: the ratchet, the observations and the plan. FIVE
# instruments want it -- artefact.py, observe.py, plan.py, ratchet.py and
# routines.py -- and every one of them exited 2 here until this line existed.
# This reconstruction had the instruments and not the ratchet: nothing in it
# could notice a match getting shorter. re-kit issue #1.
register = "status.toml"
# Which files in `built` are OURS. EXPLICIT, not a glob, and deliberately so:
# a glob can include but not exclude, and a compare tool aimed at an original
# measures it against itself and PASSES, which is the worst kind of wrong. Our
# build leaves exactly one executable. The originals are ref/*.bin and
# ../DEMOVT15/DEMOVT.EXE, and neither is in `built`.
built_pattern = ["VTMAIN.EXE"]
# The shared assembler includes, compared against the units. WITHOUT THIS the
# duplicate check has a hole exactly where its own fix lives: a marker followed
# by {$I} is skipped as shared, so an include body is compared against nothing
# and a unit holding its own copy pairs with nobody. This tree has VTGAIN.INC,
# so the hole was real here and the instrument said so on every run.
includes = "src"
# Assembler duplicated between units that cannot become one text. Measured
# empty -- see the file's own header. shared_asm.py refuses to report without
# it, so this answer is what lets the check run at all rather than what
# excuses anything.
exempt = "src/shared-exempt.txt"

[target]
# The paragraph the disassembly calls the start of the load image. Every address
# in this project's notes and configs is relative to it.
first_para = 0x1000

# The measurement target: the v1.31b build recovered from NEUROSIS.008 by
# kit/tools/substrate/unlzexe.py. 58,176 bytes. It is TRACKED deliberately -- a
# checkout that cannot measure itself is not much use -- and refpath.py says
# what the unpacking cannot tell you about it.
image = "ref/vt1.31b.bin"

[encaudit]
# Where to look for text I/O that leaves the encoding to the locale. The kit's
# check refused outright without this -- `kit.toml does not answer` -- so it was
# not running here at all, in a repository whose whole subject is DOS files that
# must be written as ascii. The kit's own tiers are listed because nothing else
# scans them: v1.51 is its own root and audits only its sources, so the kit's
# coverage lives here.
dirs = ["src", ".", "../kit/tools", "../kit/tools/substrate",
        "../kit/tools/pascal", "../kit/tools/wikitools"]

[census]
# Directories holding scripts, for the retirement census. The psycho checkout's
# path is machine-specific and belongs in kit.local.toml, not here.
roots = [".", "../kit/tools"]
