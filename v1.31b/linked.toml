# The linked image's segment layout, and what counts as a DGROUP address.
#
# GENERATED from v1.31b/linkcmp.py by parsing it, when that tool merged
# into the kit's linkcmp (psycho issue #33). Thirty-one addresses retyped
# by hand is thirty-one chances to compare two different units.

image = "VTMAIN.EXE"      # our linked image, in the build directory
map   = "VTMAIN.MAP"      # and its map, which says where each unit landed

# The initialised/uninitialised DGROUP boundary. A differing operand above
# it on both sides is a VARIABLE address -- the thing being measured. Below
# it is the initialised half, which is measured exactly elsewhere, so a
# difference there is a regression.
varbase  = 0x0C70
# The original's DGROUP size, so an operand past it is not an address.
datalen  = 0x4690
# A plausible misplacement. Beyond this the two words are not the same
# variable in two places, they are unrelated numbers.
maxdelta = 8192

# Not ours to compare: the runtime library's own units.
skip = ['DOS', 'OBJECTS', 'SYSTEM']

# The ORIGINAL's segment layout. Ours is read from the .MAP; the original
# has no map, so it is declared. Each entry's extent is the NEXT entry's
# address minus its own, so the last entry is a bound and names no unit.
[[segment]]
at   = 0x1000
unit = 'DEMOVT'

